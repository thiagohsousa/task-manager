<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Task-Manager</title>
</head>
<body>
     <div class="cadastro-container">
        <h1>Cadastro Task-Manager</h1>
        <form action="/cadastro" method="post">
            <label for="username">Nome do Usuário</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Informe o Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Informe a Senha</label>
            <input type="password" id="password" name="password" required>

            <div class="buttons">
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </div>
            <p style="text-align: center; margin-top: 15px;">
             Já tem uma conta? 
             <a href="/auth/login">Faça login</a>
            </p>
        </form>
    </div>
    <style>
.cadastro-container {
    background-color: #1b2847;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    width: 350px;
}

.cadastro-container h1 {
    text-align: center;
    color: #007BFF;
    margin-bottom: 30px;
}
body {
   background-color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
* {
    color: #ffffff;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.3s;
}

input:focus {
    border-color: hsl(211, 100%, 50%);
    outline: none;
}

.buttons {
    display: flex;
    justify-content: space-between;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
}

button[type="submit"] {
    background-color: #007BFF;
    color: white;
}

button[type="submit"]:hover {
    background-color: #0056b3;
}

button[type="reset"] {
    background-color: #cc0000;
}

button[type="reset"]:hover {
    background-color: #bdbdbd;

}

    </style>
    
</body>
</html>
