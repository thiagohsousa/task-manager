<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

 <style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        height: 100vh;
        background: linear-gradient(180deg, #1e293b, #0f172a);
        position: fixed;
        padding: 20px;
    }

    .sidebar h2 {
        text-align: center;
        color: #38bdf8;
        margin-bottom: 30px;
    }

    .sidebar a {
        display: block;
        margin-top: 15px;
        padding: 12px;
        background: #1e293b;
        color: #e2e8f0;
        text-decoration: none;
        border-radius: 10px;
        text-align: center;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background: #38bdf8;
        color: #0f172a;
    }

    /* CONTEÚDO */
    .content {
        margin-left: 270px;
        padding: 40px;
    }

    h1 {
        color: #38bdf8;
    }

    p {
        color: #94a3b8;
    }

    /* BOX DO FORM */
    .task-box {
        margin-top: 20px;
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    input, select {
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #0f172a;
        color: #e2e8f0;
        outline: none;
    }

    button {
        padding: 10px;
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        background: #0ea5e9;
    }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Task Manager</h2>

    <a href="/dashboard/{{ usuario_id }}">Dashboard</a>
    <a href="/tarefas/{{ usuario_id }}">Minhas tarefas</a>
</div>

<!-- CONTEÚDO -->
<div class="content">

    <div class="header">
        <h1>Dashboard</h1>
        <p>Gerencie suas tarefas 🚀</p>
    </div>

    <!-- CRIAR TAREFA -->
    <div class="task-box">
        <form action="/tarefa/criar" method="post">

            <input type="text" name="titulo" placeholder="Título..." required>

            <input type="text" name="descricao" placeholder="Descrição..." required>

            <select name="status">
                <option value="PENDENTE">Pendente</option>
                <option value="EM_ANDAMENTO">Em andamento</option>
                <option value="CONCLUIDA">Concluído</option>
            </select>

            <input type="hidden" name="usuario_id" value="{{ usuario_id }}">

            <button type="submit">Adicionar</button>
        </form>
    </div>

</div>

</body>
</html>
